<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" width="1040" height="300" role="img" aria-labelledby="d1title d1desc">
  <title id="d1title">Product Workflow and Human Review Boundary</title>
  <desc id="d1desc">Data and model artifacts enter the AgentX validation workflow, which produces evidence outputs. Evidence outputs cross a marked review boundary into a human authority zone, arriving as pending_review. AgentX produces structured evidence only; it does not make the final decision.</desc>
  <defs>
    <marker id="d1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="300" fill="#f7f8fa" stroke="#d7dbe1" stroke-width="1" />
  <rect x="0" y="0" width="1040" height="56" fill="#161b26" />
  <text x="24" y="35" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#f5f6f8">Product Workflow and Human Review Boundary</text>
  <rect x="0" y="56" width="1040" height="4" fill="#8c1f2b" />

  <!-- Human authority zone -->
  <rect x="790" y="93" width="210" height="114" rx="6" fill="#fbeceb" stroke="#d9a9ac" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="895" y="108" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.6" fill="#8c1f2b">HUMAN AUTHORITY ZONE</text>

  <!-- Review boundary marker -->
  <line x1="765" y1="88" x2="765" y2="212" stroke="#8c1f2b" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Nodes -->
  <rect x="40" y="113" width="190" height="74" rx="6" fill="#ffffff" stroke="#4a5568" stroke-width="1.5" />
  <text x="135" y="143" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2430">Data and Model</text>
  <text x="135" y="163" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2430">Artifacts</text>

  <rect x="290" y="113" width="190" height="74" rx="6" fill="#ffffff" stroke="#4a5568" stroke-width="1.5" />
  <text x="385" y="143" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2430">AgentX Validation</text>
  <text x="385" y="163" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2430">Workflow</text>

  <rect x="540" y="113" width="190" height="74" rx="6" fill="#ffffff" stroke="#4a5568" stroke-width="1.5" />
  <text x="635" y="155" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2430">Evidence Outputs</text>

  <rect x="800" y="113" width="190" height="74" rx="6" fill="#ffffff" stroke="#4a5568" stroke-width="1.5" />
  <text x="895" y="143" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1f2430">Human Reviewer /</text>
  <text x="895" y="163" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1f2430">Governance Review</text>

  <!-- Arrows -->
  <line x1="230" y1="150" x2="286" y2="150" stroke="#4a5568" stroke-width="2" marker-end="url(#d1-arrow)" />
  <line x1="480" y1="150" x2="536" y2="150" stroke="#4a5568" stroke-width="2" marker-end="url(#d1-arrow)" />
  <line x1="730" y1="150" x2="796" y2="150" stroke="#4a5568" stroke-width="2" marker-end="url(#d1-arrow)" />

  <!-- Handoff badge -->
  <rect x="690" y="222" width="150" height="26" rx="13" fill="#ffffff" stroke="#8c1f2b" stroke-width="1.5" />
  <text x="765" y="239" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.5" fill="#8c1f2b">REVIEW HANDOFF</text>
  <text x="765" y="270" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#5b6370">pending_review</text>
</svg>
