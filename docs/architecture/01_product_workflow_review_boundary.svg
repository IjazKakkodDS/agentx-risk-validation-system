<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1330 200" width="1330" height="200" role="img" aria-labelledby="d1title d1desc">
  <title id="d1title">Product Workflow and Human Review Boundary</title>
  <desc id="d1desc">Data and model artifacts enter the AgentX validation workflow, which produces evidence outputs. Evidence crosses into the Human Authority zone as pending_review. AgentX produces structured evidence only; it does not make the final decision.</desc>
  <defs>
    <marker id="d1-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1330" height="200" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="0" y="0" width="1330" height="46" rx="8" fill="#0F172A"/>
  <rect x="0" y="34" width="1330" height="12" fill="#0F172A"/>
  <rect x="0" y="46" width="1330" height="3" fill="#8C1F2B"/>
  <text x="665" y="30" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#F1F5F9">Product Workflow and Human Review Boundary</text>
  <rect x="10" y="58" width="900" height="126" rx="4" fill="#EFF6FF"/>
  <text x="22" y="77" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#1D4ED8" letter-spacing="1.3">AGENTX VALIDATION</text>
  <rect x="940" y="58" width="380" height="126" rx="4" fill="#FFFBEB"/>
  <text x="952" y="77" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#B45309" letter-spacing="1.3">HUMAN AUTHORITY</text>
  <rect x="1150" y="66" width="158" height="20" rx="10" fill="#B45309"/>
  <text x="1229" y="80" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.3" fill="#FFFFFF">STATUS: PENDING_REVIEW</text>
  <rect x="30" y="98" width="270" height="64" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="165" y="126" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#1E40AF">Data and Model Artifacts</text>
  <text x="165" y="143" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#1E40AF" opacity="0.82">LendingClub · 5,000 rows · 12 features</text>
  <rect x="340" y="98" width="270" height="64" rx="6" fill="#E2E8F0" stroke="#475569" stroke-width="1.5"/>
  <text x="475" y="126" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#0F172A">AgentX Validation Workflow</text>
  <text x="475" y="143" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#0F172A" opacity="0.82">7-agent sequential pipeline</text>
  <rect x="650" y="98" width="240" height="64" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="770" y="126" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#064E3B">Evidence Outputs</text>
  <text x="770" y="143" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#064E3B" opacity="0.82">Governance · metrics · audit pack</text>
  <rect x="990" y="88" width="280" height="84" rx="6" fill="#FDE68A" stroke="#B45309" stroke-width="1.5"/>
  <text x="1130" y="114" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#451A03">Human Reviewer /</text>
  <text x="1130" y="132" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#451A03">Governance Review</text>
  <text x="1130" y="154" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#451A03" opacity="0.82">risk_flags · reviewer_notes</text>
  <line x1="300" y1="130" x2="336" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#d1-ah)"/>
  <line x1="610" y1="130" x2="646" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#d1-ah)"/>
  <line x1="890" y1="130" x2="986" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#d1-ah)"/>
  <line x1="925" y1="64" x2="925" y2="178" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="4,4"/>
</svg>
