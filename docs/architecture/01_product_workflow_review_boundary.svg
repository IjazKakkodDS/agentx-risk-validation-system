<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 190" width="1180" height="190" role="img" aria-labelledby="d1title d1desc">
  <title id="d1title">Product Workflow and Human Review Boundary</title>
  <desc id="d1desc">Data and model artifacts enter the AgentX validation workflow, which produces evidence outputs. Evidence crosses into the Human Authority zone as pending_review. AgentX produces structured evidence only; it does not make the final decision.</desc>
  <defs>
    <marker id="d1-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1180" height="190" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="0" y="0" width="1180" height="46" rx="8" fill="#0F172A"/>
  <rect x="0" y="34" width="1180" height="12" fill="#0F172A"/>
  <rect x="0" y="46" width="1180" height="3" fill="#8C1F2B"/>
  <text x="590" y="30" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#F1F5F9">Product Workflow and Human Review Boundary</text>
  <rect x="10" y="58" width="790" height="106" rx="4" fill="#EFF6FF"/>
  <text x="22" y="77" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#1D4ED8" letter-spacing="1.3">AGENTX VALIDATION</text>
  <rect x="820" y="58" width="350" height="106" rx="4" fill="#FFFBEB"/>
  <text x="832" y="77" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#B45309" letter-spacing="1.3">HUMAN AUTHORITY</text>
  <rect x="1000" y="66" width="158" height="20" rx="10" fill="#B45309"/>
  <text x="1079" y="80" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.3" fill="#FFFFFF">STATUS: PENDING_REVIEW</text>
  <rect x="30" y="88" width="220" height="64" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="140" y="116" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#1E40AF">Data and Model</text>
  <text x="140" y="133" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#1E40AF" opacity="0.82">Artifacts</text>
  <rect x="290" y="88" width="240" height="64" rx="6" fill="#E2E8F0" stroke="#475569" stroke-width="1.5"/>
  <text x="410" y="116" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#0F172A">AgentX Validation</text>
  <text x="410" y="133" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#0F172A" opacity="0.82">Workflow</text>
  <rect x="570" y="88" width="200" height="64" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="670" y="125" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#064E3B">Evidence Outputs</text>
  <rect x="850" y="88" width="260" height="64" rx="6" fill="#FDE68A" stroke="#B45309" stroke-width="1.5"/>
  <text x="980" y="116" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#451A03">Human Reviewer /</text>
  <text x="980" y="133" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#451A03" opacity="0.82">Governance Review</text>
  <line x1="250" y1="120" x2="286" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#d1-ah)"/>
  <line x1="530" y1="120" x2="566" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#d1-ah)"/>
  <line x1="770" y1="120" x2="846" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#d1-ah)"/>
  <line x1="805" y1="64" x2="805" y2="158" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="4,4"/>
</svg>
