  <text x="623" y="172" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="9.5" fill="#3B0764" opacity="0.82">shap_summary.png</text>
  <rect x="762" y="96" width="210" height="82" rx="6" fill="#FED7AA" stroke="#EA580C" stroke-width="1.5"/>
