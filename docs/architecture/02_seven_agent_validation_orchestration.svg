  <rect x="1006" y="96" width="210" height="82" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="1111" y="124" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#14532D">FeedbackMemoryAgent</text>
  <line x1="1022" y1="144" x2="1200" y2="144" stroke="#16A34A" stroke-width="1" opacity="0.4"/>
  <text x="1111" y="159" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="9.5" fill="#14532D" opacity="0.82">data/model_memory/</text>
  <rect x="1250" y="96" width="210" height="82" rx="6" fill="#FBCFE8" stroke="#DB2777" stroke-width="1.5"/>
  <text x="1355" y="124" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#831843">ComplianceAgent</text>
  <line x1="1266" y1="144" x2="1444" y2="144" stroke="#DB2777" stroke-width="1" opacity="0.4"/>
  <text x="1355" y="159" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="9.5" fill="#831843" opacity="0.82">data/validation_outputs/</text>
  <text x="1355" y="172" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="9.5" fill="#831843" opacity="0.82">last_compliance.json</text>
  <rect x="1494" y="96" width="210" height="82" rx="6" fill="#A5F3FC" stroke="#0891B2" stroke-width="1.5"/>
  <text x="1599" y="124" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#083344">ReportWriterAgent</text>
  <line x1="1510" y1="144" x2="1688" y2="144" stroke="#0891B2" stroke-width="1" opacity="0.4"/>
  <text x="1599" y="159" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="9.5" fill="#083344" opacity="0.82">reports/</text>
  <text x="1599" y="172" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="9.5" fill="#083344" opacity="0.82">validation_report.md</text>
  <rect x="1499" y="70" width="200" height="20" rx="10" fill="#0F172A"/>
  <text x="1599" y="84" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.3" fill="#FFFFFF">FINAL EVIDENCE OUTCOME</text>
  <line x1="244" y1="137" x2="270" y2="137" stroke="#475569" stroke-width="2" marker-end="url(#d2-ah)"/>
  <line x1="488" y1="137" x2="514" y2="137" stroke="#475569" stroke-width="2" marker-end="url(#d2-ah)"/>
  <line x1="732" y1="137" x2="758" y2="137" stroke="#475569" stroke-width="2" marker-end="url(#d2-ah)"/>
  <line x1="976" y1="137" x2="1002" y2="137" stroke="#475569" stroke-width="2" marker-end="url(#d2-ah)"/>
  <line x1="1220" y1="137" x2="1246" y2="137" stroke="#475569" stroke-width="2" marker-end="url(#d2-ah)"/>
  <line x1="1464" y1="137" x2="1490" y2="137" stroke="#475569" stroke-width="2" marker-end="url(#d2-ah)"/>
</svg>
