  <rect x="30" y="96" width="210" height="82" rx="6" fill="#BBF7D0" stroke="#059669" stroke-width="1.5"/>
  <text x="135" y="124" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#064E3B">DataValidatorAgent</text>
  <line x1="46" y1="144" x2="224" y2="144" stroke="#059669" stroke-width="1" opacity="0.4"/>
  <text x="135" y="159" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="9.5" fill="#064E3B" opacity="0.82">data/validation_outputs/</text>
  <text x="135" y="172" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="9.5" fill="#064E3B" opacity="0.82">data_validation.json</text>
  <rect x="274" y="96" width="210" height="82" rx="6" fill="#FECACA" stroke="#DC2626" stroke-width="1.5"/>
  <text x="379" y="124" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#7F1D1D">PerformanceAgent</text>
  <line x1="290" y1="144" x2="468" y2="144" stroke="#DC2626" stroke-width="1" opacity="0.4"/>
  <text x="379" y="159" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="9.5" fill="#7F1D1D" opacity="0.82">data/validation_outputs/</text>
  <text x="379" y="172" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="9.5" fill="#7F1D1D" opacity="0.82">performance_metrics.json</text>
  <rect x="518" y="96" width="210" height="82" rx="6" fill="#E9D5FF" stroke="#9333EA" stroke-width="1.5"/>
  <text x="623" y="124" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#3B0764">ExplainabilityAgent</text>
  <line x1="534" y1="144" x2="712" y2="144" stroke="#9333EA" stroke-width="1" opacity="0.4"/>
