<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1734 214" width="1734" height="214" role="img" aria-labelledby="d2title d2desc">
  <title id="d2title">Seven-Agent Validation Orchestration</title>
  <desc id="d2desc">Seven agents run in a fixed sequence, sharing one validation run context: DataValidatorAgent, PerformanceAgent, ExplainabilityAgent, DriftMonitorAgent, FeedbackMemoryAgent, ComplianceAgent, and ReportWriterAgent. Each node is labelled with the exact evidence artifact file it writes, and ReportWriterAgent is marked as the run's final evidence outcome.</desc>
  <defs>
    <marker id="d2-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1734" height="214" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="0" y="0" width="1734" height="46" rx="8" fill="#0F172A"/>
  <rect x="0" y="34" width="1734" height="12" fill="#0F172A"/>
  <rect x="0" y="46" width="1734" height="3" fill="#8C1F2B"/>
  <text x="867" y="30" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#F1F5F9">Seven-Agent Validation Orchestration</text>
  <rect x="10" y="58" width="1714" height="140" rx="4" fill="#F1F5F9"/>
  <text x="22" y="77" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="1.3">SEVEN-AGENT EXECUTION SEQUENCE</text>
  <rect x="762" y="64" width="210" height="20" rx="10" fill="#334155"/>
