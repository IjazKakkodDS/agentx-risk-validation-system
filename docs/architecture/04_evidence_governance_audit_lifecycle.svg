<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="d4title d4desc">
  <title id="d4title">Evidence, Governance, and Audit-Pack Lifecycle</title>
  <desc id="d4desc">On validation run completion, metrics are locked and artifacts are verified in parallel, then converge into a governance JSON record. The governance record fans out to an MLflow file store and an audit pack in Markdown, HTML, and PDF format. The MLflow and audit-pack steps are optional and degrade gracefully on failure without stopping the run; metric locking and governance-record creation are not optional.</desc>
  <defs>
    <marker id="d4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568" />
    </marker>
    <marker id="d4-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a3" />
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="500" fill="#f7f8fa" stroke="#d7dbe1" stroke-width="1" />
  <rect x="0" y="0" width="900" height="56" fill="#161b26" />
  <text x="24" y="35" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#f5f6f8">Evidence, Governance, and Audit-Pack Lifecycle</text>
  <rect x="0" y="56" width="900" height="4" fill="#8c1f2b" />

  <!-- A -->
  <rect x="330" y="88" width="280" height="64" rx="6" fill="#ffffff" stroke="#4a5568" stroke-width="1.5" />
  <text x="470" y="125" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2430">Validation Run Complete</text>

  <!-- B, C -->
  <rect x="150" y="192" width="240" height="64" rx="6" fill="#ffffff" stroke="#4a5568" stroke-width="1.5" />
  <text x="270" y="229" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2430">Metrics Locked</text>

  <rect x="550" y="192" width="240" height="64" rx="6" fill="#ffffff" stroke="#4a5568" stroke-width="1.5" />
  <text x="670" y="229" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2430">Artifacts Verified</text>

  <!-- D -->
  <rect x="320" y="296" width="300" height="64" rx="6" fill="#ffffff" stroke="#4a5568" stroke-width="1.5" />
  <text x="470" y="333" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2430">Governance JSON Record</text>

  <!-- E, F -->
  <rect x="90" y="400" width="250" height="64" rx="6" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5" />
  <text x="215" y="437" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2430">MLflow File Store</text>

  <rect x="460" y="400" width="330" height="64" rx="6" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5" />
  <text x="625" y="437" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2430">Audit Pack: MD / HTML / PDF</text>

  <!-- Mandatory arrows -->
  <line x1="420" y1="152" x2="300" y2="188" stroke="#4a5568" stroke-width="2" marker-end="url(#d4-arrow)" />
  <line x1="520" y1="152" x2="640" y2="188" stroke="#4a5568" stroke-width="2" marker-end="url(#d4-arrow)" />
  <line x1="290" y1="256" x2="420" y2="292" stroke="#4a5568" stroke-width="2" marker-end="url(#d4-arrow)" />
  <line x1="650" y1="256" x2="520" y2="292" stroke="#4a5568" stroke-width="2" marker-end="url(#d4-arrow)" />

  <!-- Optional, graceful-degradation arrows -->
  <line x1="420" y1="360" x2="240" y2="396" stroke="#8a93a3" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#d4-arrow-muted)" />
  <line x1="520" y1="360" x2="620" y2="396" stroke="#8a93a3" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#d4-arrow-muted)" />
  <text x="470" y="382" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-style="italic" font-size="10.5" fill="#8a93a3">optional — graceful degradation on failure</text>
</svg>
