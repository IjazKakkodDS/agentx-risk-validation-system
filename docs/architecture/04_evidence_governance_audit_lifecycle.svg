<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 534" width="860" height="534" role="img" aria-labelledby="d4title d4desc">
  <title id="d4title">Evidence, Governance, and Audit-Pack Lifecycle</title>
  <desc id="d4desc">On validation run completion (main.py Steps 1-10), metrics are locked and artifacts are verified (Step 11), then converge into a governance JSON record (Step 12) carrying validation_run_id, reviewer_status, and risk_flags. The record fans out to an MLflow file store and an audit pack (Steps 13-14), both optional and failure-bounded; they degrade gracefully without stopping the run.</desc>
  <defs>
    <marker id="d4-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="534" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="0" y="0" width="860" height="46" rx="8" fill="#0F172A"/>
  <rect x="0" y="34" width="860" height="12" fill="#0F172A"/>
  <rect x="0" y="46" width="860" height="3" fill="#8C1F2B"/>
  <text x="430" y="30" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#F1F5F9">Evidence, Governance, and Audit-Pack Lifecycle</text>
  <rect x="10" y="58" width="840" height="102" rx="4" fill="#EFF6FF"/>
  <text x="22" y="77" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#1D4ED8" letter-spacing="1.3">VALIDATION COMPLETE</text>
  <text x="838" y="77" text-anchor="end" font-family="Consolas,Menlo,monospace" font-size="9.5" font-weight="700" fill="#1D4ED8" opacity="0.85">STEPS 1–10</text>
  <rect x="10" y="172" width="840" height="102" rx="4" fill="#FFF1F2"/>
  <text x="22" y="191" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#BE123C" letter-spacing="1.3">MANDATORY EVIDENCE</text>
  <text x="838" y="191" text-anchor="end" font-family="Consolas,Menlo,monospace" font-size="9.5" font-weight="700" fill="#BE123C" opacity="0.85">STEP 11</text>
  <rect x="10" y="286" width="840" height="102" rx="4" fill="#F1F5F9"/>
  <text x="22" y="305" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="1.3">GOVERNANCE RECORD</text>
  <text x="838" y="305" text-anchor="end" font-family="Consolas,Menlo,monospace" font-size="9.5" font-weight="700" fill="#475569" opacity="0.85">STEP 12</text>
  <rect x="10" y="400" width="840" height="118" rx="4" fill="#FFFBEB"/>
  <text x="22" y="419" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#B45309" letter-spacing="1.3">OPTIONAL OUTPUTS</text>
  <text x="838" y="419" text-anchor="end" font-family="Consolas,Menlo,monospace" font-size="9.5" font-weight="700" fill="#B45309" opacity="0.85">STEPS 13–14</text>
  <rect x="270" y="88" width="320" height="64" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="430" y="116" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#1E40AF">Validation Run Complete</text>
  <text x="430" y="133" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#1E40AF" opacity="0.82">data · model · agent outputs ready</text>
  <rect x="50" y="202" width="340" height="64" rx="6" fill="#FECACA" stroke="#DC2626" stroke-width="1.5"/>
  <text x="220" y="230" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#7F1D1D">Metrics Locked</text>
  <text x="220" y="247" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#7F1D1D" opacity="0.82">accuracy · precision · recall · f1 · roc_auc</text>
  <rect x="470" y="202" width="340" height="64" rx="6" fill="#E9D5FF" stroke="#9333EA" stroke-width="1.5"/>
  <text x="640" y="230" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#3B0764">Artifacts Verified</text>
  <text x="640" y="247" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#3B0764" opacity="0.82">8 evidence files checked</text>
  <rect x="200" y="316" width="460" height="64" rx="6" fill="#E2E8F0" stroke="#475569" stroke-width="1.5"/>
