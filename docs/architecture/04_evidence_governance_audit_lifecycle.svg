  <text x="430" y="361" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#0F172A" opacity="0.82">validation_run_id · reviewer_status · risk_flags</text>
  <rect x="60" y="434" width="320" height="74" rx="6" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="220" y="467" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#6B7280">MLflow File Store</text>
  <text x="220" y="484" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6B7280" opacity="0.82">5 metrics · 8 params · agentx_risk_validation</text>
  <rect x="480" y="434" width="320" height="74" rx="6" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="640" y="467" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#6B7280">Audit Pack</text>
  <text x="640" y="484" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6B7280" opacity="0.82">MD  ·  HTML  ·  PDF  ·  JSON context</text>
  <rect x="302" y="424" width="78" height="20" rx="10" fill="#9CA3AF"/>
  <text x="341" y="438" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.3" fill="#FFFFFF">OPTIONAL</text>
  <rect x="722" y="424" width="78" height="20" rx="10" fill="#9CA3AF"/>
  <text x="761" y="438" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.3" fill="#FFFFFF">OPTIONAL</text>
