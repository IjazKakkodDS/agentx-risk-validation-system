  <path d="M430,152 C430,166 640,188 640,202" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d4-ah)"/>
  <path d="M220,266 C220,280 430,302 430,316" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d4-ah)"/>
  <path d="M640,266 C640,280 430,302 430,316" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d4-ah)"/>
  <path d="M430,380 C430,394 220,420 220,434" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#d4-ah)"/>
  <path d="M430,380 C430,394 640,420 640,434" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#d4-ah)"/>
