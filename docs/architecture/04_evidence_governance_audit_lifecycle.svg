<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 516" width="860" height="516" role="img" aria-labelledby="d4title d4desc">
  <title id="d4title">Evidence, Governance, and Audit-Pack Lifecycle</title>
  <desc id="d4desc">On validation run completion, metrics are locked and artifacts are verified, then converge into a governance JSON record. The record fans out to an MLflow file store and an audit pack, both optional and failure-bounded; they degrade gracefully without stopping the run.</desc>
  <defs>
    <marker id="d4-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="516" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="0" y="0" width="860" height="46" rx="8" fill="#0F172A"/>
  <rect x="0" y="34" width="860" height="12" fill="#0F172A"/>
  <rect x="0" y="46" width="860" height="3" fill="#8C1F2B"/>
  <text x="430" y="30" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#F1F5F9">Evidence, Governance, and Audit-Pack Lifecycle</text>
  <rect x="10" y="58" width="840" height="96" rx="4" fill="#EFF6FF"/>
  <text x="22" y="77" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#1D4ED8" letter-spacing="1.3">VALIDATION COMPLETE</text>
  <rect x="10" y="166" width="840" height="96" rx="4" fill="#FFF1F2"/>
  <text x="22" y="185" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#BE123C" letter-spacing="1.3">MANDATORY EVIDENCE</text>
  <rect x="10" y="274" width="840" height="96" rx="4" fill="#F1F5F9"/>
  <text x="22" y="293" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="1.3">GOVERNANCE RECORD</text>
  <rect x="10" y="382" width="840" height="118" rx="4" fill="#FFFBEB"/>
  <text x="22" y="401" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#B45309" letter-spacing="1.3">OPTIONAL OUTPUTS</text>
  <rect x="280" y="88" width="300" height="58" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="430" y="122" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#1E40AF">Validation Run Complete</text>
  <rect x="60" y="196" width="320" height="58" rx="6" fill="#FECACA" stroke="#DC2626" stroke-width="1.5"/>
  <text x="220" y="230" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#7F1D1D">Metrics Locked</text>
  <rect x="480" y="196" width="320" height="58" rx="6" fill="#E9D5FF" stroke="#9333EA" stroke-width="1.5"/>
  <text x="640" y="230" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#3B0764">Artifacts Verified</text>
  <rect x="250" y="304" width="360" height="58" rx="6" fill="#E2E8F0" stroke="#475569" stroke-width="1.5"/>
  <text x="430" y="338" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#0F172A">Governance JSON Record</text>
  <rect x="60" y="416" width="320" height="70" rx="6" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="220" y="456" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#6B7280">MLflow File Store</text>
  <rect x="480" y="416" width="320" height="70" rx="6" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="640" y="447" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#6B7280">Audit Pack</text>
  <text x="640" y="464" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6B7280" opacity="0.82">MD  ·  HTML  ·  PDF</text>
  <rect x="302" y="406" width="78" height="20" rx="10" fill="#9CA3AF"/>
  <text x="341" y="420" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.3" fill="#FFFFFF">OPTIONAL</text>
  <rect x="722" y="406" width="78" height="20" rx="10" fill="#9CA3AF"/>
  <text x="761" y="420" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.3" fill="#FFFFFF">OPTIONAL</text>
  <path d="M430,146 C430,160 220,182 220,196" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d4-ah)"/>
  <path d="M430,146 C430,160 640,182 640,196" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d4-ah)"/>
  <path d="M220,254 C220,268 430,290 430,304" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d4-ah)"/>
  <path d="M640,254 C640,268 430,290 430,304" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d4-ah)"/>
  <path d="M430,362 C430,376 220,402 220,416" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#d4-ah)"/>
  <path d="M430,362 C430,376 640,402 640,416" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#d4-ah)"/>
</svg>
